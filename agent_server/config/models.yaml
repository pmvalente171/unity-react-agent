# Model cards: what each model deployment can do.
# The server uses the card named by `active`; the ACTIVE_MODEL env var overrides it.
# Changing models needs a server restart for now.
#
# Fields:
#   provider                    which LLM class to use ("openai" also covers OpenAI-compatible servers)
#   model_id                    the model name the provider's API expects
#   base_url                    set for OpenAI-compatible servers (vLLM, Ollama, ...); omit for OpenAI
#   api_key_env                 name of the env var holding the API key (the key itself never goes here)
#   headers                     extra HTTP headers sent on every request (name: value)
#   context_window              max tokens of input (informational for now)
#   max_output_tokens           max tokens the model can produce (informational for now)
#   supports_native_tools       false -> the agent must use text-based ReAct (not implemented yet)
#   can_disable_parallel_tools  true -> the API accepts `parallel_tool_calls`, so the server sets it to
#                               false (one action per step); false -> the flag is never sent
#   supports_system_role        false -> the system prompt is merged into the first user message
#   emits_reasoning             the model returns hidden reasoning (informational for now)
#
# ${VAR} in base_url and in header names or values is replaced with that env var (e.g. from
# .env), so private hosts and secrets stay out of git. It is resolved only for the active model.

active: gemma

models:
  gpt-4.1-mini:
    provider: openai
    model_id: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    context_window: 1047576
    max_output_tokens: 32768
    supports_native_tools: true
    can_disable_parallel_tools: true
    supports_system_role: true
    emits_reasoning: false

  # Gemma 4 served by vLLM. Host and key come from .env (VLLM_HOST, VLLM_API_KEY).
  # Native tool calls verified 2026-11-24 (full action -> observation -> final loop).
  # Still unverified: system role and parallel flag (`./probe_model.sh gemma`).
  # supports_system_role stays false: merging the prompt into the first user message
  # is safe either way.
  gemma:
    provider: openai
    base_url: ${VLLM_HOST}
    model_id: google/gemma-4-31B-it
    api_key_env: VLLM_API_KEY
    supports_native_tools: true
    can_disable_parallel_tools: false
    supports_system_role: false
    emits_reasoning: false

  # Ollama, through its OpenAI-compatible API (/v1). Host and the auth header
  # (both its name and its value) come from .env. Fill in model_id with a model the
  # server has: `python tools/probe_model.py ollama` lists them.
  ollama:
    provider: openai
    base_url: ${OLLAMA_HOST}/v1
    model_id: SET-ME
    headers:
      ${OLLAMA_HEADER_KEY}: ${OLLAMA_HEADER_VALUE}
    supports_native_tools: false
    can_disable_parallel_tools: false
    supports_system_role: true
    emits_reasoning: false
